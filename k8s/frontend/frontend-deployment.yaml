apiVersion: apps/v1
kind: Deployment
metadata:
  name: eduplaty-frontend
  namespace: eduplaty
spec:
  replicas: 2
  selector:
    matchLabels:
      app: eduplaty-frontend
  template:
    metadata:
      labels:
        app: eduplaty-frontend
    spec:
      containers:
        - name: eduplaty-frontend
          image: suhas15234/eduplaty-frontend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: eduplaty-frontend
  namespace: eduplaty
spec:
  selector:
    app: eduplaty-frontend
  ports:
    - port: 80
      targetPort: 80
  type: LoadBalancer
